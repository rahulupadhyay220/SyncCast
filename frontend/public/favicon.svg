<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#181a20"/>
      <stop offset="50%" stopColor="#0e1015"/>
      <stop offset="100%" stopColor="#050608"/>
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="rgba(255, 255, 255, 0.3)"/>
      <stop offset="100%" stopColor="rgba(229, 9, 20, 0.6)"/>
    </linearGradient>
    <linearGradient id="favRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ff4d52"/>
      <stop offset="100%" stopColor="#e50914"/>
    </linearGradient>
    <linearGradient id="favPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ff383f"/>
      <stop offset="60%" stopColor="#e50914"/>
      <stop offset="100%" stopColor="#b20710"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" floodColor="#e50914" floodOpacity="0.7"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#favBorder)" stroke-width="1.8"/>

  <!-- Sync Orbit Arcs -->
  <path d="M 16 20 A 19 19 0 0 1 48 20" stroke="url(#favRed)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="48" cy="20" r="3" fill="#ff4d52" filter="url(#favGlow)"/>

  <path d="M 48 44 A 19 19 0 0 1 16 44" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="44" r="2.5" fill="#ffffff"/>

  <!-- Play Symbol -->
  <g filter="url(#favGlow)">
    <path d="M 27 23.5 C 27 22.4 28.2 21.7 29.2 22.3 L 41.2 29.3 C 42.1 29.8 42.1 31.2 41.2 31.7 L 29.2 38.7 C 28.2 39.3 27 38.6 27 37.5 Z" fill="url(#favPlay)"/>
  </g>
</svg>
